version: "3.9"

# Aegis SOC Platform - local/small-business deployment.
# Uses SQLite (mounted volume) by default; no external database container
# required. Swap `DB_DIALECT` to postgres and uncomment the db service
# below if you outgrow the single-file database.

services:
  backend:
    build:
      context: ./backend
    container_name: aegis-soc-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      DB_DIALECT: sqlite
      DB_STORAGE: /app/data/aegis-soc.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 8h
      BCRYPT_SALT_ROUNDS: 12
    volumes:
      - aegis-soc-data:/app/data
      - aegis-soc-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: aegis-soc-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # --- Optional: PostgreSQL for production-scale deployments ---
  # db:
  #   image: postgres:16-alpine
  #   container_name: aegis-soc-db
  #   environment:
  #     POSTGRES_DB: aegis_soc
  #     POSTGRES_USER: aegis_admin
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - aegis-soc-postgres:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  aegis-soc-data:
  aegis-soc-logs:
  # aegis-soc-postgres:
